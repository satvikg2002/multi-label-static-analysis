[project]
name = "multi-label-static-analysis"
version = "0.1.0"
description = "EMBER2024 static malware detection and multi-label classification"
readme = "README.md"
authors = [
    { name = "Satvik", email = "satvik.noida@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.10.1",
    "huggingface-hub>=2.4.0",
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pefile>=2024.8.26",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "signify>=0.9.3",
    "threadpoolctl>=3.6.0",
]

[project.scripts]
multi-label-static-analysis = "multi_label_static_analysis:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src/multi-label-static-analysis"
source-include = [
    "uv.lock",
    ".python-version",
    "src/multi-label-static-analysis/configs/**",
    "src/multi-label-static-analysis/notebooks/**",
    "src/multi-label-static-analysis/tests/**",
    "src/multi-label-static-analysis/results/historical/**",
]
source-exclude = [
    "**/data/**",
    "**/artifacts/**",
    "**/__pycache__/**",
    "**/.DS_Store",
    "src/multi-label-static-analysis/results/primary_analysis/**",
    "src/multi-label-static-analysis/results/repository_baseline/**",
]
wheel-exclude = ["**/data/**", "**/__pycache__/**", "**/.DS_Store"]

[tool.multi-label-static-analysis]
notebook = "src/multi-label-static-analysis/notebooks/ember2024_primary_analysis.ipynb"
data-dir = "src/multi-label-static-analysis/multi_label_static_analysis/data/ember_data"
reports-dir = "src/multi-label-static-analysis/results/primary_analysis"
artifacts-dir = "src/multi-label-static-analysis/artifacts"

historical-reports-dir = "src/multi-label-static-analysis/results/historical"
